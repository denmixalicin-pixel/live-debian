name: Build Debian ISO

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            dosfstools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            debian-archive-keyring
          
          # Скачиваем и добавляем актуальный ключ подписи Debian Bookworm, которого нет в старой Ubuntu 22.04
          sudo gpg --keyserver ://ubuntu.com --recv-keys F8D2585B8783D481
          sudo gpg --export F8D2585B8783D481 | sudo tee /usr/share/keyrings/debian-archive-keyring.gpg > /dev/null

      - name: Build ISO in clean directory
        run: |
          # Уничтожаем глобальный кэш Ubuntu, который ломал логику
          sudo rm -rf /var/cache/live-build
          sudo rm -rf .build cache config
          
          # Настраиваем строго режим Debian без ручных (и ломающихся) зеркал
          sudo lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free-firmware" \
            --cache false \
            --cache-stages false \
            --debian-installer live

          # Создаем список пакетов
          sudo mkdir -p config/package-lists
          cat <<'EOF' | sudo tee config/package-lists/custom.list.chroot
          curl
          git
          vim
          htop
          openssh-client
          EOF

          # Запуск сборки
          sudo lb build

      - name: Fix permissions
        if: always()
        run: |
          sudo chown -R $USER:$USER .

      - name: Find generated ISO
        run: |
          ls -lh
          find . -maxdepth 2 -type f \
            \( -name "*.iso" -o -name "*.img" \) \
            -print

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: debian-live-iso
          path: |
            *.iso
            *.img
          if-no-files-found: error
