name: Build Debian ISO

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Скачиваем и деармируем официальный ключ Debian 12 (Bookworm) в потоке
      - name: Install dependencies and download Debian keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            dosfstools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            curl
          
          sudo mkdir -p /usr/share/keyrings
          curl -sL https://debian.org | sudo gpg --dearmor | sudo tee /usr/share/keyrings/debian-archive-keyring.gpg > /dev/null

      - name: Add packages configuration
        run: |
          sudo mkdir -p config/package-lists
          cat <<'EOF' | sudo tee config/package-lists/custom.list.chroot
          curl
          git
          vim
          htop
          openssh-client
          EOF

      # ОБЪЕДИНЯЕМ ВСЕ ЭТАПЫ В ОДИН: Очистка -> Конфигурация с полными зеркалами -> Сборка
      - name: Configure and Build ISO (Clean Run)
        run: |
          sudo lb clean --purge
          sudo rm -rf .build cache config/binary config/bootstrap config/chroot config/source
          
          sudo lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free-firmware" \
            --debian-installer live \
            --mirror-bootstrap "http://debian.org" \
            --mirror-chroot "http://debian.org" \
            --mirror-binary "http://debian.org" \
            --parent-mirror-bootstrap "http://debian.org" \
            --parent-mirror-chroot "http://debian.org" \
            --parent-mirror-binary "http://debian.org"
          
          # Запускаем сборку сразу же в этом контексте
          sudo lb build

      - name: Fix permissions for artifacts
        if: always()
        run: |
          sudo chown -R $USER:$USER .

      - name: Find generated ISO
        run: |
          ls -lh
          find . -maxdepth 2 -type f \
            \( -name "*.iso" -o -name "*.img" \) \
            -print

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: debian-live-iso
          path: |
            *.iso
            *.img
          if-no-files-found: error
