name: Build Debian ISO

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            dosfstools \
            grub-pc-bin \
            grub-efi-amd64-bin

      - name: Configure live-build
        run: |
          sudo lb config \
            --distribution bookworm \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free-firmware" \
            --debian-installer live

      - name: Add packages
        run: |
          sudo mkdir -p config/package-lists

          cat <<'EOF' | sudo tee config/package-lists/custom.list.chroot
          curl
          git
          vim
          htop
          openssh-client
          EOF

      # ИСПРАВЛЕНИЕ 1: Отключаем строгую проверку GPG-ключей debootstrap на хосте
      - name: Patch debootstrap for GitHub Actions
        run: |
          echo -e '#!/bin/sh\n/usr/sbin/debootstrap --no-check-gpg "$@"' | sudo tee /usr/local/sbin/debootstrap > /dev/null
          sudo chmod +x /usr/local/sbin/debootstrap

      # ИСПРАВЛЕНИЕ 2: Подменяем битый URL в wget на правильный (с /main/), который отдает сервер
      - name: Patch wget for Contents-amd64.gz 404 error
        run: |
          cat <<'EOF' | sudo tee /usr/local/bin/wget > /dev/null
          #!/bin/sh
          case "$*" in
            *Contents-amd64.gz*)
              # На лету исправляем хардкод live-build и подставляем корректный путь в репозитории
              NEW_ARGS=$(echo "$@" | sed 's|/dists/bookworm/Contents-amd64.gz|/dists/bookworm/main/Contents-amd64.gz|g')
              exec /usr/bin/wget $NEW_ARGS
              ;;
            *)
              exec /usr/bin/wget "$@"
              ;;
          esac
          EOF
          sudo chmod +x /usr/local/bin/wget

      - name: Build ISO
        run: |
          sudo lb build

      # Фиксим права, так как lb build создает файлы от root, и Actions без этого не сможет их выгрузить
      - name: Fix permissions for artifacts
        if: always()
        run: |
          sudo chown -R $USER:$USER .

      - name: Find generated ISO
        run: |
          ls -lh
          find . -maxdepth 2 -type f \
            \( -name "*.iso" -o -name "*.img" \) \
            -print

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: debian-live-iso
          path: |
            *.iso
            *.img
          if-no-files-found: error
