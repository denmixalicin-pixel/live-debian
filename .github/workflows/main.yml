name: Build Debian ISO

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            dosfstools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            debian-archive-keyring

      - name: Build ISO in clean directory
        run: |
          # 1. Полная зачистка старых системных кэшей Ubuntu
          sudo rm -rf /var/cache/live-build
          sudo rm -rf .build cache config
          
          # 2. Настраиваем сборку
          sudo lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free-firmware" \
            --cache false \
            --cache-stages false \
            --security false \
            --linux-flavours amd64 \
            --bootloader grub-pc \
            --debian-installer live
          
          # 3. Создаем список пакетов ОС
          sudo mkdir -p config/package-lists
          cat <<'EOF' | sudo tree config/package-lists/custom.list.chroot
          curl
          git
          vim
          htop
          openssh-client
          EOF
          
          # Хак 1: Обход проверки старых GPG ключей хоста
          echo -e '#!/bin/sh\n/usr/sbin/debootstrap --no-check-gpg "$@"' | sudo tee /usr/local/sbin/debootstrap > /dev/null
          sudo chmod +x /usr/local/sbin/debootstrap

          # Хак 2: Создаем фейковый Contents-amd64.gz, который упрямо ищет live-build
          # Создаем структуру папок внутри кэша/рабочей зоны, куда лезет скрипт
          sudo mkdir -p chroot/root/
          sudo mkdir -p dpage dists/bookworm
          echo "" | gzip | sudo tee dists/bookworm/Contents-amd64.gz > /dev/null
          
          # Делаем то же самое для папки кэша, если утилита проверяет её
          sudo mkdir -p cache/packages.binary/dists/bookworm
          echo "" | gzip | sudo tee cache/packages.binary/dists/bookworm/Contents-amd64.gz > /dev/null

          # 4. Запуск сборки
          sudo lb build

      - name: Fix permissions
        if: always()
        run: |
          sudo chown -R $USER:$USER .

      - name: Find generated ISO
        run: |
          ls -lh
          find . -maxdepth 2 -type f \
            \( -name "*.iso" -o -name "*.img" \) \
            -print

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: debian-live-iso
          path: |
            *.iso
            *.img
          if-no-files-found: error
