name: Build Debian ISO

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Устанавливаем базовые утилиты хоста
          sudo apt-get install -y \
            debootstrap xorriso squashfs-tools dosfstools \
            grub-pc-bin grub-efi-amd64-bin debian-archive-keyring

          # ПРАВИЛЬНОЕ РЕШЕНИЕ: Скачиваем и ставим официальный актуальный live-build из репозитория Debian.
          # Он полностью совместим с Debian 12 Bookworm и не содержит багов старой версии Ubuntu 22.04.
          curl -LO http://debian.org
          sudo apt-get install -y ./live-build_20230502_all.deb
          rm live-build_20230502_all.deb

      - name: Build ISO Image
        run: |
          # Полная зачистка перед стартом
          sudo rm -rf .build cache config
          
          # Чистая конфигурация live-build актуальной версии
          sudo lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free-firmware" \
            --debian-installer live
          
          # Создаем список пакетов ОС
          sudo mkdir -p config/package-lists
          cat <<'EOF' | sudo tee config/package-lists/custom.list.chroot
          curl
          git
          vim
          htop
          openssh-client
          EOF
          
          # Чистый запуск сборки фреймворком
          sudo lb build

      - name: Fix permissions
        if: always()
        run: |
          sudo chown -R $USER:$USER .

      - name: Find generated ISO
        run: |
          ls -lh
          find . -maxdepth 2 -type f \
            \( -name "*.iso" -o -name "*.img" \) \
            -print

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: debian-live-iso
          path: |
            *.iso
            *.img
          if-no-files-found: error
