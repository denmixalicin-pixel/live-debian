name: Build Debian ISO

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            dosfstools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            debian-archive-keyring

      - name: Build ISO in clean directory
        run: |
          # 1. Зачищаем остатки
          sudo rm -rf /var/cache/live-build
          sudo rm -rf .build cache config
          
          # 2. Конфигурируем в режиме debian (--mode debian) с полными путями к зеркалам
          sudo lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free-firmware" \
            --cache false \
            --cache-stages false \
            --mirror-bootstrap "http://debian.org" \
            --mirror-chroot "http://debian.org" \
            --mirror-binary "http://debian.org" \
            --parent-mirror-bootstrap "http://debian.org" \
            --parent-mirror-chroot "http://debian.org" \
            --parent-mirror-binary "http://debian.org" \
            --parent-mirror-binary-security "http://debian.org" \
            --mirror-binary-security "http://debian.org" \
            --debian-installer live

          # 3. Добавляем кастомные пакеты
          sudo mkdir -p config/package-lists
          cat <<'EOF' | sudo tee config/package-lists/custom.list.chroot
          curl
          git
          vim
          htop
          openssh-client
          EOF

          # 4. Запускаем чистую сборку
          sudo lb build

      - name: Fix permissions
        if: always()
        run: |
          sudo chown -R $USER:$USER .

      - name: Find generated ISO
        run: |
          ls -lh
          find . -maxdepth 2 -type f \
            \( -name "*.iso" -o -name "*.img" \) \
            -print

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: debian-live-iso
          path: |
            *.iso
            *.img
          if-no-files-found: error
